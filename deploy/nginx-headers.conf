# Browser security headers for Lindero's own pages (code review P2-2).
#
# Included inside each STATIC location of the Lindero site — `/`,
# `= /index.html`, `/assets/`, `= /sw.js`, `= /manifest.webmanifest` — and
# deliberately NOT at server level and NOT in `location /api/`:
#
# - nginx drops every server-level add_header in a location that has an
#   add_header of its own, and each of those locations has one (Cache-Control),
#   so a server-level copy would reach almost nothing.
# - The document viewer shows receipts and contracts by FRAMING
#   /api/attachments/:id/file and /api/contract-documents/:id/file. "Never put
#   me in a frame" there would blank the viewer. Those responses already carry
#   their own sandboxing CSP (backend/src/lib/storedFiles.ts).
#
# Installed once, by hand; see docs/deployment-shared-droplet.md, "9d. Browser
# security headers". `always` sends them on error pages too.

# HTTPS only for this host, for a year. No includeSubDomains: other names under
# basculacentral.com are not Lindero's to decide for. Keep it that way.
add_header Strict-Transport-Security "max-age=31536000" always;

# Lindero is never shown inside another site's frame (clickjacking).
add_header X-Frame-Options "DENY" always;

# A file is what its Content-Type says, never what the browser guesses.
add_header X-Content-Type-Options "nosniff" always;

# Other sites see only "lindero.basculacentral.com", never a page's full path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing in Lindero uses the camera, microphone or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Where a page may load things from. REPORT-ONLY for now: the browser only logs
# what it would have blocked (DevTools console, "[Report Only]"), nothing breaks.
# Once a week of normal use shows no reports, rename the header to
# Content-Security-Policy to enforce it.
#   - Google fonts:            fonts.googleapis.com (CSS), fonts.gstatic.com (files)
#   - Google Drive picker:     apis.google.com, accounts.google.com, docs/drive.google.com
#   - Drive file download:     www.googleapis.com
#   - data: and blob: images   the receipt image (html-to-image) and local previews
#   - blob: frames             a scan previewed in the viewer before it is uploaded
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' blob: https://docs.google.com https://drive.google.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
