# Let scanned contracts through: the API takes up to 30 MB for them
# (MAX_DOCUMENT_BYTES in backend/src/lib/storedFiles.ts), while every other
# /api/ route keeps the 13m set in the block this sits in.
#
# Included inside `location /api/ { ... }` of the Lindero site, so this is a
# nested location: it inherits that block's proxy headers and compression.
# Only the proxy target is repeated, because nginx does not inherit
# proxy_pass. Installed once, by hand; see docs/deployment-shared-droplet.md,
# "9c. Let contract scans through".
location ~ ^/api/contracts/[^/]+/documents$ {
    # The same address as the proxy_pass of the block around this one:
    # Lindero's port on the shared droplet (3000 is bascula-central's).
    proxy_pass http://127.0.0.1:3001;
    # A little above 30 MB: the multipart boundaries ride on top of the file.
    client_max_body_size 31m;
}
