# Nginx site for Lindero's test site. deploy/setup-test-site.sh installs it as
# /etc/nginx/sites-available/lindero-test; the first server block on its own is
# what the certificate check needs before there is a certificate.
#
# The same shape as the live site (docs/nginx.conf.example, which explains each
# part), with its own address, folder and port. Three differences on purpose:
#
#   - Port 3101 everywhere. lindero-api-documents.conf is NOT included: it names
#     the live site's port, so a test upload would reach the real server.
#   - X-Robots-Tag in every location. nginx drops a server-level add_header in any
#     location that has an add_header of its own, and each of these does.
#   - `listen 443 ssl http2`, because this droplet's nginx is 1.24 and `http2 on;`
#     needs 1.25.1. A file nginx refuses would stop it starting at the next reboot.

server {
    listen 80;
    listen [::]:80;
    server_name prueba-lindero.basculacentral.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prueba-lindero.basculacentral.com;

    ssl_certificate     /etc/letsencrypt/live/prueba-lindero.basculacentral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prueba-lindero.basculacentral.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LinderoSSL:10m;
    ssl_session_tickets off;

    root /var/www/lindero-test/frontend/dist;
    index index.html;

    location / {
        include snippets/lindero-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include snippets/lindero-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        include snippets/lindero-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        include snippets/lindero-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include snippets/lindero-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        include snippets/lindero-api-gzip.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 13m;

        location ~ ^/api/contracts/[^/]+/documents$ {
            proxy_pass http://127.0.0.1:3101;
            client_max_body_size 31m;
        }
    }
}
