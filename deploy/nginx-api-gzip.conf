# Compress Lindero's API answers on their way to the browser.
#
# Included inside `location /api/ { ... }` of the Lindero site, so it touches
# nothing that bascula-central serves. Installed once, by hand; see
# docs/deployment-shared-droplet.md, "9b. Compress the API".
#
# The transactions list is about 6 MB of JSON at five years of data and 18 MB
# at ten; compressed it is roughly a tenth of that, which is the difference
# between a phone on mobile data waiting and not.
gzip on;
# Answers that come from proxy_pass count as "proxied", which nginx does not
# compress unless told to.
gzip_proxied any;
# Below this, compressing costs more than it saves.
gzip_min_length 1024;
gzip_types application/json;
# text/event-stream (the live-update feed) is deliberately NOT listed:
# compressing it would make nginx hold the stream back until a buffer fills.
# Receipt photos and PDFs are already compressed and are not listed either.
